<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinSight Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar p-3">
            <div class="brand mb-4">
                <h4 class="mb-0">FinSight</h4>
                <small>Risk Analytics Suite</small>
            </div>
            <nav class="nav flex-column gap-2">
                <a class="nav-link {% if request.path in ['/', '/dashboard'] %}active{% endif %}" href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
                <a class="nav-link {% if request.path == '/portfolio' %}active{% endif %}" href="{{ url_for('dashboard.portfolio') }}">Portfolio</a>
                <a class="nav-link {% if request.path == '/analytics' %}active{% endif %}" href="{{ url_for('analytics.analytics') }}">Analytics</a>
                <a class="nav-link {% if request.path == '/goals' %}active{% endif %}" href="{{ url_for('dashboard.goals') }}">Goals</a>
                <a class="nav-link {% if request.path == '/transactions' %}active{% endif %}" href="{{ url_for('transactions.transactions') }}">Transactions</a>
            </nav>
            <hr>
            <button id="themeToggle" class="btn btn-outline-light w-100">Toggle Dark Mode</button>
        </aside>
        <main class="content p-4 p-lg-5">
            <header class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="mb-0">{% block page_title %}Dashboard{% endblock %}</h2>
                    <small class="text-secondary">Welcome back, {{ user.name }}</small>
                </div>
                <div class="badge text-bg-primary p-2">Live Financial Intelligence</div>
            </header>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
    {% block page_scripts %}{% endblock %}
</body>
</html>
